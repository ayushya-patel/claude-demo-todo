<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>To-do</title>
  <style>
    :root {
      --color-bg: #f7f7f9;
      --color-text: #1f2328;
      --color-muted: #6a737d;
      --color-border: #c9ced6;
      --color-accent: #0b5fff;
      --color-focus: #0b5fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121212;
        --color-text: #e0e0e0;
        --color-muted: #9e9e9e;
        --color-border: #2d2d2d;
        --color-accent: #5fa3ff;
        --color-focus: #5fa3ff;
      }
    }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }

    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    main h1 {
      margin: 0 0 1.5rem 0;
      font-size: 1.75rem;
    }

    #todo-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    #todo-form label {
      font-weight: 500;
      font-size: 0.9rem;
    }

    #todo-form input {
      padding: 0.75rem;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    #todo-form button {
      padding: 0.75rem 1rem;
      background: var(--color-accent);
      color: white;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
    }

    #todo-form button:hover {
      opacity: 0.9;
    }

    #todo-list {
      list-style: none;
      padding: 0;
      margin: 0 0 1.5rem 0;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--color-border);
    }

    #todo-list label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      cursor: pointer;
    }

    #todo-list input[type="checkbox"] {
      cursor: pointer;
      width: 1.125rem;
      height: 1.125rem;
    }

    .done {
      text-decoration: line-through;
      color: var(--color-muted);
    }

    #todo-list button {
      background: none;
      border: none;
      color: var(--color-muted);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
      margin-left: auto;
    }

    #todo-list button:hover {
      color: var(--color-accent);
    }

    #todo-count {
      color: var(--color-muted);
      font-size: 0.9rem;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <h1>To-do</h1>
    <form id="todo-form">
      <label for="todo-input">New task</label>
      <input id="todo-input" type="text" autocomplete="off" placeholder="What needs to be done?">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list">
      <li>
        <label><input type="checkbox"> <span>Buy groceries</span></label>
        <button>Delete</button>
      </li>
      <li>
        <label><input type="checkbox" checked> <span class="done">Water plants</span></label>
        <button>Delete</button>
      </li>
      <li>
        <label><input type="checkbox"> <span>Call mom</span></label>
        <button>Delete</button>
      </li>
    </ul>
    <p id="todo-count">1 of 3 tasks completed</p>
  </main>
</body>
</html>
