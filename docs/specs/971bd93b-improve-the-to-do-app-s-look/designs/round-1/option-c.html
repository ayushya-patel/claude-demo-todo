<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>To-do — Paper notebook</title><style>:root{--color-bg:#faf7f2;--color-text:#2b2722;--color-muted:#8a8178;--color-border:#e6dfd4;--color-accent:#b4532a;--color-focus:#b4532a}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:32rem;margin:0 auto;padding:4rem 1.25rem}h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:2.75rem;letter-spacing:-.01em}.date{margin:.25rem 0 2rem;color:var(--color-muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.12em}#todo-form{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1.5rem}#todo-form label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted)}.field{flex:1}#todo-input{width:100%;font:inherit;font-size:1.1rem;padding:.5rem 0;border:0;border-bottom:2px solid var(--color-text);background:transparent;color:var(--color-text)}#todo-input:focus-visible{outline:none;border-bottom-color:var(--color-accent)}#todo-form button{font:inherit;font-size:.9rem;padding:.55rem 1.1rem;border:2px solid var(--color-text);border-radius:0;background:var(--color-text);color:var(--color-bg);cursor:pointer;letter-spacing:.04em}#todo-form button:hover{background:var(--color-accent);border-color:var(--color-accent)}#todo-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--color-border)}#todo-list li{display:flex;align-items:center;gap:.75rem;padding:.9rem 0;border-bottom:1px solid var(--color-border)}#todo-list label{display:flex;align-items:center;gap:.9rem;flex:1;cursor:pointer;font-size:1.05rem}#todo-list input[type=checkbox]{appearance:none;width:18px;height:18px;margin:0;border:1.5px solid var(--color-text);border-radius:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:transparent}#todo-list input[type=checkbox]:checked{background:var(--color-accent);border-color:var(--color-accent)}#todo-list input[type=checkbox]:checked::after{content:'';width:5px;height:10px;border:solid var(--color-bg);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}.done{text-decoration:line-through;text-decoration-color:var(--color-accent);color:var(--color-muted);font-style:italic}.del{font:inherit;font-size:.8rem;padding:.25rem 0;border:0;background:transparent;color:var(--color-muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.del:hover{color:var(--color-accent)}#todo-count{margin:1.5rem 0 0;font-family:Georgia,serif;font-style:italic;color:var(--color-muted)}#todo-list input:focus-visible,button:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px}.empty{padding:2rem 0;border-bottom:1px solid var(--color-border);font-family:Georgia,serif;font-style:italic;color:var(--color-muted)}.caption{margin-top:3rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted)}</style></head><body><main><h1>To-do</h1><p class="date">Thursday, 8 October</p><form id="todo-form"><div class="field"><label for="todo-input">New task</label><input id="todo-input" type="text" placeholder="Write something down…" autocomplete="off"></div><button type="submit">Add</button></form><ul id="todo-list"><li><label><input type="checkbox" checked><span class="done">Book dentist appointment</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox" checked><span class="done">Reply to Sam about Friday</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Pick up dry cleaning</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Water the plants</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Draft Q4 budget notes</span></label><button class="del" type="button">Delete</button></li></ul><p id="todo-count">2 of 5 completed</p><p class="caption">Empty list preview</p><div class="empty">A blank page. Add your first task above.</div><p id="c2" style="margin:1rem 0 0;font-family:Georgia,serif;font-style:italic;color:var(--color-muted)">0 of 0 completed</p></main></body></html>
