<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>To-do — Bold header</title><style>:root{--color-bg:#f5f3ff;--color-surface:#ffffff;--color-text:#1e1b2e;--color-muted:#6b6880;--color-border:#e7e4f3;--color-accent:#7c3aed;--color-accent-2:#db2777;--color-success:#16a34a;--color-focus:#facc15}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:36rem;margin:2.5rem auto;border-radius:24px;overflow:hidden;background:var(--color-surface);box-shadow:0 20px 40px rgba(124,58,237,.15)}.band{background:linear-gradient(135deg,var(--color-accent),var(--color-accent-2));color:#fff;padding:2rem 2rem 1.5rem}h1{margin:0 0 .25rem;font-size:2.25rem;font-weight:800;letter-spacing:-.03em}.sub{margin:0 0 1.25rem;opacity:.85;font-size:.95rem}#todo-form{display:flex;background:#fff;border-radius:14px;padding:.35rem;box-shadow:0 6px 16px rgba(0,0,0,.15)}#todo-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#todo-input{flex:1;font:inherit;padding:.7rem .9rem;border:0;background:transparent;color:var(--color-text)}#todo-input:focus-visible{outline:none}#todo-form:focus-within{box-shadow:0 0 0 3px var(--color-focus),0 6px 16px rgba(0,0,0,.15)}#todo-form button{font:inherit;font-weight:700;padding:.7rem 1.4rem;border:0;border-radius:10px;background:var(--color-text);color:#fff;cursor:pointer}.progress{margin-top:1.25rem}.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}.bar span{display:block;height:100%;width:40%;background:#fff;border-radius:999px}#todo-count{margin:.5rem 0 0;font-size:.85rem;font-weight:600}#todo-list{list-style:none;margin:0;padding:.75rem 1rem 1.25rem}#todo-list li{display:flex;align-items:center;gap:1rem;padding:1rem;border-radius:14px}#todo-list li+li{border-top:1px solid var(--color-border)}#todo-list li:hover{background:#faf8ff}#todo-list label{display:flex;align-items:center;gap:1rem;flex:1;cursor:pointer;font-size:1.05rem}#todo-list input[type=checkbox]{appearance:none;width:24px;height:24px;margin:0;border:2px solid #c9c3e6;border-radius:7px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}#todo-list input[type=checkbox]:checked{background:var(--color-success);border-color:var(--color-success)}#todo-list input[type=checkbox]:checked::after{content:'';width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}.done{text-decoration:line-through;text-decoration-thickness:2px;color:var(--color-muted)}.del{font:inherit;font-size:.8rem;font-weight:600;padding:.4rem .8rem;border:1px solid var(--color-border);border-radius:999px;background:#fff;color:var(--color-muted);cursor:pointer}.del:hover{border-color:var(--color-accent-2);color:var(--color-accent-2)}button:focus-visible,#todo-list input:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}.empty{text-align:center;padding:2.5rem 1rem;color:var(--color-muted)}.empty b{display:block;font-size:1.1rem;color:var(--color-text);margin-bottom:.25rem}.caption{text-align:center;color:var(--color-muted);font-size:.8rem}</style></head><body><main><div class="band"><h1>To-do</h1><p class="sub">What's on your list today?</p><form id="todo-form"><label for="todo-input">New task</label><input id="todo-input" type="text" placeholder="Add a new task…" autocomplete="off"><button type="submit">Add</button></form><div class="progress"><div class="bar" aria-hidden="true"><span></span></div><p id="todo-count">2 of 5 completed</p></div></div><ul id="todo-list"><li><label><input type="checkbox" checked><span class="done">Book dentist appointment</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox" checked><span class="done">Reply to Sam about Friday</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Pick up dry cleaning</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Water the plants</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Draft Q4 budget notes</span></label><button class="del" type="button">Delete</button></li></ul></main><p class="caption">Empty list preview ↓</p><main><div class="empty"><b>All clear!</b>Add a task above to get started. · 0 of 0 completed</div></main></body></html>
