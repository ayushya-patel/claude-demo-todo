<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>To-do — Soft card</title><style>:root{--color-bg:#eef1f6;--color-surface:#ffffff;--color-text:#1f2328;--color-muted:#6a737d;--color-border:#e3e7ee;--color-accent:#4f6bed;--color-accent-soft:#e8ecfd;--color-danger:#c2410c;--color-focus:#4f6bed}*{box-sizing:border-box}body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}main{max-width:34rem;margin:3rem auto;padding:2rem;background:var(--color-surface);border-radius:20px;box-shadow:0 10px 30px rgba(31,35,40,.08),0 2px 6px rgba(31,35,40,.04)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}h1{margin:0;font-size:1.75rem;letter-spacing:-.02em}.ring{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--color-accent) 0 144deg,var(--color-accent-soft) 144deg 360deg);display:grid;place-items:center}.ring span{width:40px;height:40px;border-radius:50%;background:var(--color-surface);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--color-accent)}#todo-form{display:flex;gap:.5rem;margin-bottom:1.25rem}#todo-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#todo-input{flex:1;font:inherit;padding:.75rem 1rem;border:1px solid var(--color-border);border-radius:12px;background:#f9fafc}#todo-input::placeholder{color:#9aa1ab}#todo-form button{font:inherit;font-weight:600;padding:.75rem 1.25rem;border:0;border-radius:12px;background:var(--color-accent);color:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(79,107,237,.35)}#todo-form button:hover{background:#3f5ae0}#todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}#todo-list li{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem .9rem;border:1px solid var(--color-border);border-radius:12px;transition:background .15s}#todo-list li:hover{background:#f9fafc}#todo-list label{display:flex;align-items:center;gap:.75rem;flex:1;cursor:pointer}#todo-list input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid #c3c9d4;border-radius:50%;margin:0;display:grid;place-items:center;cursor:pointer;flex-shrink:0}#todo-list input[type=checkbox]:checked{background:var(--color-accent);border-color:var(--color-accent)}#todo-list input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}.done{text-decoration:line-through;color:var(--color-muted)}.del{font:inherit;font-size:.85rem;padding:.35rem .7rem;border:0;border-radius:8px;background:transparent;color:var(--color-muted);cursor:pointer}.del:hover{background:#fff1ea;color:var(--color-danger)}#todo-count{margin:1.25rem 0 0;font-size:.9rem;color:var(--color-muted);text-align:center}input:focus-visible,button:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}.caption{max-width:34rem;margin:0 auto 3rem;color:var(--color-muted);font-size:.8rem;text-align:center}.empty{max-width:34rem;margin:0 auto 1rem;padding:1.5rem 2rem;background:var(--color-surface);border-radius:20px;text-align:center;color:var(--color-muted)}</style></head><body><main><header><h1>To-do</h1><div class="ring" aria-hidden="true"><span>2/5</span></div></header><form id="todo-form"><label for="todo-input">New task</label><input id="todo-input" type="text" placeholder="Add a new task…" autocomplete="off"><button type="submit">Add</button></form><ul id="todo-list"><li><label><input type="checkbox" checked><span class="done">Book dentist appointment</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox" checked><span class="done">Reply to Sam about Friday</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Pick up dry cleaning</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Water the plants</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Draft Q4 budget notes</span></label><button class="del" type="button">Delete</button></li></ul><p id="todo-count">2 of 5 completed</p></main><p class="caption">Empty list preview ↓</p><div class="empty">Nothing here yet — add your first task above.<br><small>0 of 0 completed</small></div></body></html>
