<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>To-do — iOS Reminders style</title><style>:root{--color-bg:#f2f2f7;--color-surface:rgba(255,255,255,.75);--color-text:#000;--color-muted:rgba(60,60,67,.6);--color-sep:rgba(60,60,67,.18);--color-accent:#007aff;--color-danger:#ff3b30;--color-focus:#007aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--color-text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:radial-gradient(circle at 90% 0,#d6e8ff 0,transparent 40%),radial-gradient(circle at 0 60%,#ffe3f0 0,transparent 40%),var(--color-bg);background-attachment:fixed}main{max-width:34rem;margin:0 auto;padding:3rem 1rem 8rem;display:flex;flex-direction:column}h1{margin:0;font-size:2.4rem;font-weight:800;letter-spacing:-.03em}#todo-count{order:0;margin:.15rem 0 1.25rem;font-size:.95rem;color:var(--color-muted);font-weight:500}#todo-count b{color:var(--color-accent)}#todo-list{list-style:none;margin:0;padding:0 0 0 1rem;border-radius:18px;background:var(--color-surface);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 4px 20px rgba(0,0,0,.05)}#todo-list li{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem .8rem 0}#todo-list li+li{border-top:.5px solid var(--color-sep)}#todo-list label{display:flex;align-items:center;gap:.85rem;flex:1;cursor:pointer;font-size:1.05rem}#todo-list input[type=checkbox]{appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:1.5px solid rgba(60,60,67,.35);display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:transparent}#todo-list input[type=checkbox]:checked{border-color:var(--color-accent)}#todo-list input[type=checkbox]:checked::after{content:'';width:15px;height:15px;border-radius:50%;background:var(--color-accent)}.done{color:var(--color-muted);text-decoration:line-through}.del{font:inherit;font-size:.85rem;padding:.3rem .6rem;border:0;border-radius:8px;background:transparent;color:var(--color-danger);cursor:pointer}.del:hover{background:rgba(255,59,48,.1)}#todo-form{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);width:min(32rem,calc(100% - 2rem));display:flex;gap:.4rem;padding:.4rem;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 30px rgba(0,0,0,.15)}#todo-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#todo-input{flex:1;font:inherit;font-size:1rem;padding:.7rem 1rem;border:0;border-radius:999px;background:transparent;color:var(--color-text)}#todo-input::placeholder{color:rgba(60,60,67,.45)}#todo-form button{font:inherit;font-weight:600;padding:.7rem 1.3rem;border:0;border-radius:999px;background:var(--color-accent);color:#fff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}input:focus-visible,button:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}#todo-input:focus-visible{outline-offset:-2px}.caption{margin:2rem 0 .5rem;font-size:.78rem;color:var(--color-muted);text-transform:uppercase;letter-spacing:.06em}.empty{padding:1.5rem 1rem;border-radius:18px;background:var(--color-surface);text-align:center;color:var(--color-muted)}</style></head><body><main><h1>To-do</h1><p id="todo-count">2 of 5 completed</p><ul id="todo-list"><li><label><input type="checkbox" checked><span class="done">Book dentist appointment</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox" checked><span class="done">Reply to Sam about Friday</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Pick up dry cleaning</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Water the plants</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Draft Q4 budget notes</span></label><button class="del" type="button">Delete</button></li></ul><p class="caption">Empty list preview</p><div class="empty">Nothing here yet — add your first task below.</div><form id="todo-form"><label for="todo-input">New task</label><input id="todo-input" type="text" placeholder="New reminder…" autocomplete="off"><button type="submit">Add</button></form></main></body></html>
