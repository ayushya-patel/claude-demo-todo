<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>To-do — Light glass</title><style>:root{--color-text:#1c1c1e;--color-muted:rgba(60,60,67,.6);--color-accent:#007aff;--color-danger:#ff3b30;--color-glass:rgba(255,255,255,.45);--color-glass-strong:rgba(255,255,255,.65);--color-glass-edge:rgba(255,255,255,.8);--color-focus:#007aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--color-text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:radial-gradient(circle at 15% 20%,#ffd6e8 0,transparent 40%),radial-gradient(circle at 85% 15%,#c7e3ff 0,transparent 45%),radial-gradient(circle at 70% 85%,#d9f7e8 0,transparent 45%),radial-gradient(circle at 20% 90%,#fff1c7 0,transparent 40%),#eef0f8;background-attachment:fixed}.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.7;z-index:0}.b1{width:280px;height:280px;background:#ff9ec7;top:8%;left:10%}.b2{width:320px;height:320px;background:#8fc7ff;top:40%;right:8%}.b3{width:240px;height:240px;background:#a6f0c6;bottom:5%;left:30%}main{position:relative;z-index:1;max-width:34rem;margin:3.5rem auto;padding:1.75rem;border-radius:32px;background:var(--color-glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--color-glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.3),0 20px 50px rgba(30,40,80,.15)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}h1{margin:0;font-size:2.1rem;font-weight:700;letter-spacing:-.025em}.ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--color-accent) 0 144deg,rgba(0,122,255,.15) 144deg 360deg);display:grid;place-items:center}.ring span{width:40px;height:40px;border-radius:50%;background:var(--color-glass-strong);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--color-accent)}#todo-form{display:flex;gap:.5rem;margin-bottom:1.25rem}#todo-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#todo-input{flex:1;font:inherit;font-size:1rem;padding:.8rem 1.1rem;border-radius:999px;border:1px solid var(--color-glass-edge);background:rgba(255,255,255,.55);box-shadow:inset 0 1px 3px rgba(0,0,0,.06);color:var(--color-text)}#todo-input::placeholder{color:rgba(60,60,67,.45)}#todo-form button{font:inherit;font-weight:600;padding:.8rem 1.4rem;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:linear-gradient(180deg,rgba(40,145,255,.95),rgba(0,110,240,.95));color:#fff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(0,122,255,.35)}#todo-list{list-style:none;margin:0;padding:0;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}#todo-list li{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem}#todo-list li+li{border-top:1px solid rgba(60,60,67,.12)}#todo-list label{display:flex;align-items:center;gap:.8rem;flex:1;cursor:pointer;font-size:1.02rem}#todo-list input[type=checkbox]{appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid rgba(60,60,67,.3);background:rgba(255,255,255,.5);display:grid;place-items:center;cursor:pointer;flex-shrink:0}#todo-list input[type=checkbox]:checked{background:var(--color-accent);border-color:var(--color-accent);box-shadow:0 2px 8px rgba(0,122,255,.4)}#todo-list input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}.done{text-decoration:line-through;color:var(--color-muted)}.del{font:inherit;font-size:.85rem;font-weight:500;padding:.4rem .85rem;border-radius:999px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.5);color:var(--color-danger);cursor:pointer}.del:hover{background:rgba(255,59,48,.12)}#todo-count{margin:1.1rem 0 0;text-align:center;font-size:.88rem;color:var(--color-muted)}input:focus-visible,button:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}.caption{position:relative;z-index:1;text-align:center;font-size:.78rem;color:var(--color-muted)}.empty{padding:1.75rem 1rem;text-align:center;color:var(--color-muted)}</style></head><body><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><main><header><h1>To-do</h1><div class="ring" aria-hidden="true"><span>2/5</span></div></header><form id="todo-form"><label for="todo-input">New task</label><input id="todo-input" type="text" placeholder="Add a new task…" autocomplete="off"><button type="submit">Add</button></form><ul id="todo-list"><li><label><input type="checkbox" checked><span class="done">Book dentist appointment</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox" checked><span class="done">Reply to Sam about Friday</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Pick up dry cleaning</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Water the plants</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Draft Q4 budget notes</span></label><button class="del" type="button">Delete</button></li></ul><p id="todo-count">2 of 5 completed</p></main><p class="caption">Empty list preview ↓</p><main><div class="empty">Nothing here yet — add your first task above.<br><small>0 of 0 completed</small></div></main></body></html>
