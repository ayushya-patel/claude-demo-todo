<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>To-do — Dark glass</title><style>:root{--color-text:#f5f5f7;--color-muted:rgba(235,235,245,.6);--color-accent:#0a84ff;--color-success:#30d158;--color-danger:#ff453a;--color-glass:rgba(40,40,50,.45);--color-glass-row:rgba(255,255,255,.08);--color-glass-edge:rgba(255,255,255,.18);--color-focus:#64d2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--color-text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0b0b14;overflow-x:hidden}.blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0}.b1{width:380px;height:380px;background:#5e2bff;top:-60px;left:-60px;opacity:.75}.b2{width:340px;height:340px;background:#ff2d7a;top:35%;right:-80px;opacity:.55}.b3{width:320px;height:320px;background:#ff9f0a;bottom:-80px;left:25%;opacity:.45}main{position:relative;z-index:1;max-width:34rem;margin:3.5rem auto;padding:1.75rem;border-radius:32px;background:var(--color-glass);backdrop-filter:blur(40px) saturate(160%);-webkit-backdrop-filter:blur(40px) saturate(160%);border:1px solid var(--color-glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 60px rgba(0,0,0,.5)}h1{margin:0;font-size:2.2rem;font-weight:700;letter-spacing:-.025em}.progress{margin:.9rem 0 1.4rem}.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar span{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--color-accent),#64d2ff);box-shadow:0 0 12px rgba(10,132,255,.7)}#todo-count{margin:.5rem 0 0;font-size:.85rem;color:var(--color-muted)}#todo-form{display:flex;gap:.5rem;margin-bottom:1.25rem}#todo-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#todo-input{flex:1;font:inherit;padding:.85rem 1.1rem;border-radius:999px;border:1px solid var(--color-glass-edge);background:rgba(255,255,255,.07);color:var(--color-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}#todo-input::placeholder{color:rgba(235,235,245,.4)}#todo-form button{font:inherit;font-weight:600;padding:.85rem 1.4rem;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(10,132,255,.9),rgba(0,100,220,.9));color:#fff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(10,132,255,.4)}#todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}#todo-list li{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-radius:20px;background:var(--color-glass-row);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}#todo-list li:hover{background:rgba(255,255,255,.12)}#todo-list label{display:flex;align-items:center;gap:.8rem;flex:1;cursor:pointer}#todo-list input[type=checkbox]{appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid rgba(235,235,245,.35);background:transparent;display:grid;place-items:center;cursor:pointer;flex-shrink:0}#todo-list input[type=checkbox]:checked{background:var(--color-success);border-color:var(--color-success);box-shadow:0 0 10px rgba(48,209,88,.6)}#todo-list input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}.done{text-decoration:line-through;color:var(--color-muted)}.del{font:inherit;font-size:.82rem;font-weight:500;padding:.4rem .85rem;border-radius:999px;border:1px solid rgba(255,69,58,.35);background:rgba(255,69,58,.12);color:#ff6961;cursor:pointer}.del:hover{background:rgba(255,69,58,.25)}input:focus-visible,button:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}.caption{position:relative;z-index:1;text-align:center;font-size:.78rem;color:var(--color-muted)}.empty{text-align:center;padding:1.5rem 1rem;color:var(--color-muted)}</style></head><body><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><main><h1>To-do</h1><div class="progress"><div class="bar" aria-hidden="true"><span></span></div><p id="todo-count">2 of 5 completed</p></div><form id="todo-form"><label for="todo-input">New task</label><input id="todo-input" type="text" placeholder="Add a new task…" autocomplete="off"><button type="submit">Add</button></form><ul id="todo-list"><li><label><input type="checkbox" checked><span class="done">Book dentist appointment</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox" checked><span class="done">Reply to Sam about Friday</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Pick up dry cleaning</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Water the plants</span></label><button class="del" type="button">Delete</button></li><li><label><input type="checkbox"><span>Draft Q4 budget notes</span></label><button class="del" type="button">Delete</button></li></ul></main><p class="caption">Empty list preview ↓</p><main><div class="empty">Nothing here yet — add your first task above.<br><small>0 of 0 completed</small></div></main></body></html>
