<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>To-do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Dark mode" aria-pressed="false">🌙</button>
    <h1>To-do</h1>
    <form id="todo-form">
      <label for="todo-input">New task</label>
      <input id="todo-input" type="text" placeholder="Enter a task..." autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="todo-count" aria-live="polite"></p>
  </main>
  <script type="module">
    import { mount } from './app.js';

    mount(document);
  </script>
</body>
</html>
