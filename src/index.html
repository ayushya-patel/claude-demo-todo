<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>To-do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>
  <main>
    <header>
      <h1>To-do</h1>
      <div class="ring" id="todo-ring" aria-hidden="true"><span id="todo-ring-label"></span></div>
    </header>
    <form id="todo-form">
      <label for="todo-input">New task</label>
      <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="edit-hint" class="visually-hidden" hidden>Press Enter or double-click to edit</p>
    <p id="todo-empty" class="empty">Nothing here yet — add your first task above.</p>
    <p id="todo-count" aria-live="polite"></p>
  </main>
  <script type="module">
    import { mount } from './app.js';

    mount(document);
  </script>
</body>
</html>
